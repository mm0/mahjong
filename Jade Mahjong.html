  <style>
:root {
  color-scheme: dark;
  --bg: #07231a;
  --panel: #0f3a2c;
  --panel-2: #124532;
  --ink: #eef6ef;
  --ink-dim: #a9c3b6;
  --accent: #ffd23f;
  --accent-2: #5fd0ff;
  --danger: #ff6b6b;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  overscroll-behavior: none;
  touch-action: none;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

#board {
  position: absolute;
  inset: 0;
  touch-action: none;
  display: block;
}

/* ---------- HUD ---------- */
.hud {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 8px);
  left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  pointer-events: none;
  z-index: 10;
}
.hud > * { pointer-events: auto; }

.hudStats {
  display: flex;
  gap: 14px;
  background: rgba(10, 40, 30, 0.72);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 6px 16px;
}
.stat { display: flex; flex-direction: column; align-items: center; min-width: 44px; }
.statLabel { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); }
.stat span:last-child { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }

.hudActions { display: flex; gap: 8px; }

.iconBtn {
  width: 42px; height: 42px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(10, 40, 30, 0.72);
  backdrop-filter: blur(8px);
  color: var(--ink);
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.iconBtn:active { transform: scale(0.92); background: rgba(255,255,255,0.12); }
.iconBtn.small { width: 38px; height: 38px; font-size: 16px; }

.zoomControls {
  position: absolute;
  right: 10px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
}

/* ---------- Screens / panels ---------- */
.screen[hidden] { display: none !important; }

.screen {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 20%, rgba(20,70,50,0.92), rgba(4,20,14,0.96));
  z-index: 30;
  padding: 20px;
  overflow-y: auto;
}

.panel {
  width: 100%;
  max-width: 380px;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 22px;
  padding: 24px 22px calc(22px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  text-align: center;
}

.title { font-size: 28px; margin: 4px 0 0; }
.subtitle { color: var(--ink-dim); margin: 4px 0 18px; }

.layoutGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
.layoutCard {
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  padding: 10px 4px;
  background: rgba(255,255,255,0.04);
  cursor: pointer;
  color: var(--ink);
  font-size: 12px;
}
.layoutCard .glyph { font-size: 22px; display: block; margin-bottom: 6px; }
.layoutCard.active { border-color: var(--accent); background: rgba(255,210,63,0.12); }

#difficultySegmented { margin-top: 4px; }
#difficultyHint { min-height: 28px; }

.bigBtn {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(180deg, #ffe27a, var(--accent));
  color: #22270f;
  font-weight: 700;
  font-size: 16px;
  margin-top: 8px;
  cursor: pointer;
}
.bigBtn:active { transform: scale(0.98); }

.ghostBtn {
  width: 100%;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.18);
  background: transparent;
  color: var(--ink);
  font-size: 14px;
  margin-top: 10px;
  cursor: pointer;
}
.ghostBtn.danger { color: var(--danger); border-color: rgba(255,107,107,0.4); }

.menuRow { display: flex; gap: 10px; }
.menuRow .ghostBtn { margin-top: 10px; }

.hint { color: var(--ink-dim); font-size: 12px; margin-top: 12px; }

/* ---------- settings ---------- */
.settingRow {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 2px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.segmented { display: flex; background: rgba(0,0,0,0.25); border-radius: 12px; padding: 3px; gap: 3px; }
.segBtn {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--ink-dim);
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
}
.segBtn.active { background: var(--accent); color: #22270f; font-weight: 700; }

.toggle { position: relative; display: inline-block; width: 46px; height: 28px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggleTrack {
  position: absolute; inset: 0; background: rgba(255,255,255,0.2); border-radius: 999px; transition: 0.15s;
}
.toggleTrack::before {
  content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px;
  background: white; border-radius: 50%; transition: 0.15s;
}
.toggle input:checked + .toggleTrack { background: var(--accent); }
.toggle input:checked + .toggleTrack::before { transform: translateX(18px); }

/* ---------- leaderboard ---------- */
.lbList { list-style: none; padding: 0; margin: 12px 0; text-align: left; max-height: 45vh; overflow-y: auto; }
.lbList li {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 8px;
  border-radius: 10px;
}
.lbList li:nth-child(odd) { background: rgba(255,255,255,0.03); }
.lbRank { width: 22px; text-align: center; font-weight: 700; color: var(--ink-dim); }
.lbName { flex: 1; font-weight: 600; }
.lbTime { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; }
.lbEmpty { color: var(--ink-dim); padding: 20px 0; }

#winName {
  width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.25); color: var(--ink); font-size: 15px; margin: 10px 0;
}

/* ---------- stuck banner ---------- */
.stuckBanner {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 90px);
  transform: translateX(-50%);
  background: rgba(10,30,20,0.92);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
  z-index: 15;
  font-size: 13px;
}
.smallBtn {
  border: none; background: var(--accent); color: #22270f; font-weight: 700;
  padding: 7px 12px; border-radius: 10px; font-size: 12px; cursor: pointer;
}

@media (max-width: 360px) {
  .panel { padding: 18px 16px; }
  .title { font-size: 24px; }
}

</style>
</head>
<body>
  <div id="app">
    <canvas id="board" aria-label="Mahjong board"></canvas>

    <header id="hud" class="hud">
      <button id="btnMenu" class="iconBtn" aria-label="Menu">☰</button>
      <div class="hudStats">
        <div class="stat"><span class="statLabel">Time</span><span id="statTime">00:00</span></div>
        <div class="stat"><span class="statLabel">Pairs</span><span id="statPairs">72</span></div>
      </div>
      <div class="hudActions">
        <button id="btnUndo" class="iconBtn" aria-label="Undo">↺</button>
        <button id="btnHint" class="iconBtn" aria-label="Hint">💡</button>
        <button id="btnShuffle" class="iconBtn" aria-label="Shuffle">🔀</button>
      </div>
    </header>

    <div id="zoomControls" class="zoomControls">
      <button id="btnZoomIn" class="iconBtn small" aria-label="Zoom in">＋</button>
      <button id="btnZoomOut" class="iconBtn small" aria-label="Zoom out">－</button>
      <button id="btnFit" class="iconBtn small" aria-label="Fit board">⤢</button>
    </div>

    <!-- Main Menu -->
    <div id="screenMenu" class="screen">
      <div class="panel menuPanel">
        <h1 class="title">🀄 Jade Mahjong</h1>
        <p class="subtitle">Solitaire</p>

        <div class="layoutGrid" id="layoutGrid"></div>

        <div class="segmented" id="difficultySegmented">
          <button data-difficulty="easy" class="segBtn">Easy</button>
          <button data-difficulty="medium" class="segBtn active">Medium</button>
          <button data-difficulty="hard" class="segBtn">Hard</button>
        </div>
        <p class="hint" id="difficultyHint"></p>

        <button id="btnPlay" class="bigBtn">Play</button>
        <div class="menuRow">
          <button id="btnLeaderboard" class="ghostBtn">Leaderboard</button>
          <button id="btnSettings" class="ghostBtn">Settings</button>
        </div>
        <p class="hint" id="continueHint" hidden>A game is in progress — Play will resume it.</p>
      </div>
    </div>

    <!-- Pause / in-game menu -->
    <div id="screenPause" class="screen" hidden>
      <div class="panel">
        <h2>Paused</h2>
        <button id="btnResume" class="bigBtn">Resume</button>
        <button id="btnRestartLayout" class="ghostBtn">New Deal (same layout)</button>
        <button id="btnBackToMenu" class="ghostBtn">Main Menu</button>
      </div>
    </div>

// Tile type definitions: suits, honors, flowers, seasons.
// Each tile TYPE has a stable id used for matching; category drives sprite + match rules.
window.MJ = window.MJ || {};

(function () {
  const SUITS = [
    { key: "dot", label: "Circles", color: "#2f7fd8" },
    { key: "bam", label: "Bamboo", color: "#2f9e5c" },
    { key: "chr", label: "Characters", color: "#c23b3b" },
  ];

  const WINDS = [
    { key: "wN", glyph: "北", label: "North" },
    { key: "wE", glyph: "東", label: "East" },
    { key: "wS", glyph: "南", label: "South" },
    { key: "wW", glyph: "西", label: "West" },
  ];

  const DRAGONS = [
    { key: "dR", glyph: "中", label: "Red Dragon", color: "#c23b3b" },
    { key: "dG", glyph: "發", label: "Green Dragon", color: "#2f9e5c" },
    { key: "dW", glyph: "", label: "White Dragon", color: "#6b7280" },
  ];

  const FLOWERS = [
    { key: "fPlum", glyph: "梅", label: "Plum" },
    { key: "fOrchid", glyph: "蘭", label: "Orchid" },
    { key: "fBamboo", glyph: "竹", label: "Bamboo Flower" },
    { key: "fChrys", glyph: "菊", label: "Chrysanthemum" },
  ];

  const SEASONS = [
    { key: "sSpring", glyph: "春", label: "Spring" },
    { key: "sSummer", glyph: "夏", label: "Summer" },
    { key: "sAutumn", glyph: "秋", label: "Autumn" },
    { key: "sWinter", glyph: "冬", label: "Winter" },
  ];

  // Build the full 144-tile type pool as "pair tokens": each token yields
  // exactly 2 tile instances that are valid matches for each other.
  function buildPairTokens() {
    const tokens = [];

    // Suits: 9 ranks x 3 suits x 4 copies = 108 tiles = 54 pair tokens.
    SUITS.forEach((suit) => {
      for (let rank = 1; rank <= 9; rank++) {
        const type = `${suit.key}${rank}`;
        for (let p = 0; p < 2; p++) {
          tokens.push({
            a: { type, category: "suit", suit: suit.key, rank, color: suit.color },
            b: { type, category: "suit", suit: suit.key, rank, color: suit.color },
          });
        }
      }
    });

    // Winds: 4 types x 4 copies = 16 tiles = 8 pair tokens.
    WINDS.forEach((w) => {
      for (let p = 0; p < 2; p++) {
        tokens.push({
          a: { type: w.key, category: "wind", glyph: w.glyph, label: w.label, color: "#1f2937" },
          b: { type: w.key, category: "wind", glyph: w.glyph, label: w.label, color: "#1f2937" },
        });
      }
    });

    // Dragons: 3 types x 4 copies = 12 tiles = 6 pair tokens.
    DRAGONS.forEach((d) => {
      for (let p = 0; p < 2; p++) {
        tokens.push({
          a: { type: d.key, category: "dragon", glyph: d.glyph, label: d.label, color: d.color },
          b: { type: d.key, category: "dragon", glyph: d.glyph, label: d.label, color: d.color },
        });
      }
    });

    // Flowers: 4 unique tiles, any flower matches any flower -> 2 pair tokens.
    const flowerShuffled = FLOWERS.slice();
    tokens.push({
      a: { type: flowerShuffled[0].key, category: "flower", glyph: flowerShuffled[0].glyph, label: flowerShuffled[0].label, color: "#e07a3f" },
      b: { type: flowerShuffled[1].key, category: "flower", glyph: flowerShuffled[1].glyph, label: flowerShuffled[1].label, color: "#e07a3f" },
    });
    tokens.push({
      a: { type: flowerShuffled[2].key, category: "flower", glyph: flowerShuffled[2].glyph, label: flowerShuffled[2].label, color: "#e07a3f" },
      b: { type: flowerShuffled[3].key, category: "flower", glyph: flowerShuffled[3].glyph, label: flowerShuffled[3].label, color: "#e07a3f" },
    });

    // Seasons: 4 unique tiles, any season matches any season -> 2 pair tokens.
    const seasonShuffled = SEASONS.slice();
    tokens.push({
      a: { type: seasonShuffled[0].key, category: "season", glyph: seasonShuffled[0].glyph, label: seasonShuffled[0].label, color: "#8a5fc2" },
      b: { type: seasonShuffled[1].key, category: "season", glyph: seasonShuffled[1].glyph, label: seasonShuffled[1].label, color: "#8a5fc2" },
    });
    tokens.push({
      a: { type: seasonShuffled[2].key, category: "season", glyph: seasonShuffled[2].glyph, label: seasonShuffled[2].label, color: "#8a5fc2" },
      b: { type: seasonShuffled[3].key, category: "season", glyph: seasonShuffled[3].glyph, label: seasonShuffled[3].label, color: "#8a5fc2" },
    });

    return tokens; // 72 tokens = 144 tiles
  }

  function suitGlyph(suitKey, rank) {
    if (suitKey === "chr") {
      const numerals = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
      return numerals[rank];
    }
    return String(rank);
  }

  function matches(a, b) {
    if (!a || !b || a.removed || b.removed) return false;
    if (a.category === "flower" && b.category === "flower") return true;
    if (a.category === "season" && b.category === "season") return true;
    return a.category !== "flower" && a.category !== "season" && a.type === b.type;
  }

  window.MJ.TilesData = {
    SUITS, WINDS, DRAGONS, FLOWERS, SEASONS,
    buildPairTokens, suitGlyph, matches,
  };
})();

  <script>
// Board layouts: each returns an array of {col,row,level} positions (144 total).
// Grid uses plain integer (col,row) cells per level; higher levels visually
// step up-and-right at render time. This keeps overlap/free-tile logic simple
// and bug-free while still producing a layered, sculptural look.
window.MJ = window.MJ || {};

(function () {
  function addRow(out, row, colStart, colEndInclusive, level) {
    for (let c = colStart; c <= colEndInclusive; c++) out.push({ col: c, row, level });
  }
  function addRect(out, colStart, colEndInclusive, rowStart, rowEndInclusive, level) {
    for (let r = rowStart; r <= rowEndInclusive; r++) addRow(out, r, colStart, colEndInclusive, level);
  }

  // ---- Layout 1: Turtle Cove (turtle-shaped shell, 3 levels) ----
  function turtleCove() {
    const out = [];
    addRow(out, 0, 8, 9, 0); // head tab
    addRow(out, 1, 5, 12, 0);
    addRow(out, 2, 3, 14, 0);
    out.push({ col: 0, row: 2, level: 0 }); // leg TL
    out.push({ col: 17, row: 2, level: 0 }); // leg TR
    addRow(out, 3, 2, 15, 0);
    addRow(out, 4, 1, 16, 0);
    addRow(out, 5, 1, 16, 0);
    addRow(out, 6, 2, 15, 0);
    addRow(out, 7, 3, 14, 0);
    out.push({ col: 0, row: 7, level: 0 }); // leg BL
    out.push({ col: 17, row: 7, level: 0 }); // leg BR
    addRow(out, 8, 5, 12, 0);
    addRow(out, 9, 8, 9, 0); // tail tab

    addRow(out, 3, 6, 11, 1);
    addRow(out, 4, 5, 12, 1);
    addRow(out, 5, 5, 12, 1);
    addRow(out, 6, 6, 11, 1);

    addRow(out, 4, 7, 10, 2);
    addRow(out, 5, 7, 10, 2);

    return out;
  }

  // ---- Layout 2: Step Pyramid (5 levels, centered rectangles) ----
  function stepPyramid() {
    const out = [];
    const W = 14, H = 8;
    const center = (w, h) => ({ c0: Math.floor((W - w) / 2), r0: Math.floor((H - h) / 2), c1: 0, r1: 0 });
    function level(w, h, lvl) {
      const c0 = Math.floor((W - w) / 2), r0 = Math.floor((H - h) / 2);
      addRect(out, c0, c0 + w - 1, r0, r0 + h - 1, lvl);
    }
    level(12, 6, 0); // 72
    level(10, 4, 1); // 40
    level(8, 2, 2);  // 16
    level(6, 2, 3);  // 12
    level(4, 1, 4);  // 4
    return out;
  }

  // ---- Layout 3: Fortress (walls, corner towers, central keep) ----
  function fortress() {
    const out = [];
    const W = 14, H = 6; // base footprint
    addRect(out, 0, W - 1, 0, H - 1, 0); // solid base courtyard, 84

    // ramparts: border ring of the base rect, one level up
    for (let c = 0; c < W; c++) {
      out.push({ col: c, row: 0, level: 1 });
      out.push({ col: c, row: H - 1, level: 1 });
    }
    for (let r = 1; r < H - 1; r++) {
      out.push({ col: 0, row: r, level: 1 });
      out.push({ col: W - 1, row: r, level: 1 });
    }
    // 36 wall tiles

    // corner towers, one level up from ramparts
    addRect(out, 0, 1, 0, 1, 2);
    addRect(out, W - 2, W - 1, 0, 1, 2);
    addRect(out, 0, 1, H - 2, H - 1, 2);
    addRect(out, W - 2, W - 1, H - 2, H - 1, 2);
    // 16 tower tiles

    // central keep, raised highest
    addRect(out, 5, 8, 2, 3, 3);
    // 8 keep tiles

    return out;
  }

  const LAYOUTS = {
    turtle: { name: "Turtle Cove", build: turtleCove },
    pyramid: { name: "Step Pyramid", build: stepPyramid },
    fortress: { name: "Fortress", build: fortress },
  };

  // Every layout above is designed wide (landscape) — a good fit for
  // desktop windows. transposed() swaps col/row so the same board runs
  // tall instead, for phones held in portrait; harmless to do, since the
  // game logic (matching, free-tile checks, the solvable dealer) is
  // entirely axis-agnostic.
  function transposed(positions) {
    return positions.map((p) => ({ col: p.row, row: p.col, level: p.level }));
  }

  Object.keys(LAYOUTS).forEach((key) => {
    const positions = LAYOUTS[key].build();
    if (positions.length !== 144) {
      console.error(`Layout "${key}" has ${positions.length} tiles, expected 144`);
    }
    LAYOUTS[key].positions = positions;
    LAYOUTS[key].positionsTall = transposed(positions);
  });

  window.MJ.Layouts = LAYOUTS;
})();

  <script>
// Guaranteed-solvable dealing: simulate valid PAIR removals over the board
// geometry (each pair's two tiles must be simultaneously free at the moment
// they're removed — mirrors real gameplay exactly), then assign shuffled
// matching tile-type tokens to those pairs. Replaying the same pair order
// is therefore always a legal solve.
window.MJ = window.MJ || {};

(function () {
  function isFree(pos, occupiedSet, byCell) {
    const above = byCell.get(`${pos.col},${pos.row},${pos.level + 1}`);
    if (above && occupiedSet.has(above.id)) return false;
    const left = byCell.get(`${pos.col - 1},${pos.row},${pos.level}`);
    const right = byCell.get(`${pos.col + 1},${pos.row},${pos.level}`);
    const leftBlocked = left && occupiedSet.has(left.id);
    const rightBlocked = right && occupiedSet.has(right.id);
    return !(leftBlocked && rightBlocked);
  }

  function buildIndex(positions) {
    const byCell = new Map();
    positions.forEach((p, id) => byCell.set(`${p.col},${p.row},${p.level}`, { id }));
    return byCell;
  }

  // Returns an array of [idA, idB] pairs: at the moment each pair is
  // removed, both idA and idB were free simultaneously (with all earlier
  // pairs already removed, and everything else still on the board).
  function randomPairOrder(positions, rng) {
    const byCell = buildIndex(positions);
    const occupied = new Set(positions.map((_, id) => id));
    const pairs = [];
    let remaining = positions.map((_, id) => id);

    while (remaining.length) {
      const freeIds = remaining.filter((id) => isFree(positions[id], occupied, byCell));
      if (freeIds.length < 2) return null; // stuck; caller retries with a new shuffle
      shuffleArray(freeIds, rng);
      const a = freeIds[0], b = freeIds[1];
      occupied.delete(a);
      occupied.delete(b);
      pairs.push([a, b]);
      remaining = remaining.filter((id) => id !== a && id !== b);
    }
    return pairs;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffleArray(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Full deal: positions (144 {col,row,level}) -> array of tile instances
  // aligned by index to positions, each with {type, category, ...visual}.
  function dealSolvable(positions, seed) {
    const rng = mulberry32(seed >>> 0 || (Date.now() & 0xffffffff));
    let pairs = null;
    for (let attempt = 0; attempt < 200 && !pairs; attempt++) {
      pairs = randomPairOrder(positions, rng);
    }
    if (!pairs) throw new Error("Failed to compute a valid pair removal order");

    const tokens = shuffleArray(window.MJ.TilesData.buildPairTokens(), rng);
    const tiles = new Array(positions.length);
    for (let i = 0; i < tokens.length; i++) {
      const [posA, posB] = pairs[i];
      tiles[posA] = Object.assign({}, tokens[i].a);
      tiles[posB] = Object.assign({}, tokens[i].b);
    }
    dealSolvable._lastPairs = pairs; // exposed for tests
    return tiles;
  }

  // Re-shuffle only currently-remaining tiles across their existing
  // positions, still guaranteeing solvability from this point forward.
  function reshuffleRemaining(remainingPositions, remainingTiles, seed) {
    const rng = mulberry32(seed >>> 0 || (Date.now() & 0xffffffff));
    let pairs = null;
    for (let attempt = 0; attempt < 200 && !pairs; attempt++) {
      pairs = randomPairOrder(remainingPositions, rng);
    }
    if (!pairs) return null;

    // Group remaining tiles into matching pairs (safe: counts per exact
    // type, or per wildcard category, are always even during normal play).
    // Store independent snapshots (not live tile references!) — callers
    // apply the result via in-place Object.assign over the same array the
    // groups were built from, and live references would alias and corrupt
    // each other as that mutation proceeds.
    const groups = new Map(); // key -> array of tile-data snapshots
    remainingTiles.forEach((t) => {
      const key = (t.category === "flower" || t.category === "season") ? t.category : t.type;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push({ type: t.type, category: t.category, glyph: t.glyph, suit: t.suit, rank: t.rank, color: t.color, label: t.label });
    });

    const pairTokens = [];
    groups.forEach((arr) => {
      shuffleArray(arr, rng);
      for (let i = 0; i + 1 < arr.length; i += 2) pairTokens.push([arr[i], arr[i + 1]]);
    });
    shuffleArray(pairTokens, rng);

    const out = new Array(remainingPositions.length);
    for (let i = 0; i < pairTokens.length; i++) {
      out[pairs[i][0]] = pairTokens[i][0];
      out[pairs[i][1]] = pairTokens[i][1];
    }
    reshuffleRemaining._lastPairs = pairs; // exposed for tests
    return out;
  }

  window.MJ.Dealer = { dealSolvable, reshuffleRemaining, isFree, buildIndex, mulberry32, shuffleArray };
})();

// Synthesized sound effects + generative ambient background music via Web
// Audio API — no external audio files, so the game works fully offline the

  let sfxEnabled = true;

      sfxGain.gain.value = 1;
      sfxGain.connect(ctx.destination);

      musicGain = ctx.createGain();
      musicGain.gain.value = 0;
      musicGain.connect(ctx.destination);

      musicDelay = ctx.createDelay(2);
      musicDelay.delayTime.value = 0.42;
      const feedback = ctx.createGain();
      feedback.gain.value = 0.38;
      const delayFilter = ctx.createBiquadFilter();
      delayFilter.type = "lowpass";
      delayFilter.frequency.value = 1800;

      musicDelay.connect(musicGain);

  function unlock() {

    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);

// Local leaderboard, persisted in localStorage. Scoped per layout.
window.MJ = window.MJ || {};

(function () {
  const KEY = "mj_leaderboard_v1";
  const MAX_ENTRIES_PER_LAYOUT = 20;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function save(data) {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) { /* storage unavailable; ignore */ }
  }

  function addEntry(layoutKey, entry) {
    const data = load();
    if (!data[layoutKey]) data[layoutKey] = [];
    data[layoutKey].push(entry);
    data[layoutKey].sort((a, b) => a.timeMs - b.timeMs);
    data[layoutKey] = data[layoutKey].slice(0, MAX_ENTRIES_PER_LAYOUT);
    save(data);
    return data[layoutKey].findIndex((e) => e === entry);
  }

  function getEntries(layoutKey) {
    const data = load();
    return data[layoutKey] || [];
  }

  function qualifies(layoutKey, timeMs) {
    const entries = getEntries(layoutKey);
    if (entries.length < MAX_ENTRIES_PER_LAYOUT) return true;
    return timeMs < entries[entries.length - 1].timeMs;
  }

  function clearAll() {
    save({});
  }

  window.MJ.Leaderboard = { addEntry, getEntries, qualifies, clearAll };
})();

// Canvas renderer: sprite-style tile drawing (two toggleable art styles),
// camera pan/zoom (pinch + drag) so 144 tiles stay usable on an iPhone
// screen, and hit-testing for taps.
window.MJ = window.MJ || {};

(function () {
  const TILE_W = 64, TILE_H = 84;
  const LEVEL_DX = 10, LEVEL_DY = -10;

  // Pip layout patterns (unit square 0..1) reused for dot/bamboo suits.
  const PIP_PATTERNS = {
    1: [[0.5, 0.5]],
    2: [[0.3, 0.3], [0.7, 0.7]],
    3: [[0.3, 0.25], [0.5, 0.5], [0.7, 0.75]],
    4: [[0.3, 0.3], [0.7, 0.3], [0.3, 0.7], [0.7, 0.7]],
    5: [[0.3, 0.3], [0.7, 0.3], [0.5, 0.5], [0.3, 0.7], [0.7, 0.7]],
    6: [[0.3, 0.22], [0.7, 0.22], [0.3, 0.5], [0.7, 0.5], [0.3, 0.78], [0.7, 0.78]],
    7: [[0.3, 0.2], [0.7, 0.2], [0.5, 0.42], [0.3, 0.6], [0.7, 0.6], [0.3, 0.85], [0.7, 0.85]],
    8: [[0.3, 0.16], [0.7, 0.16], [0.3, 0.38], [0.7, 0.38], [0.3, 0.6], [0.7, 0.6], [0.3, 0.82], [0.7, 0.82]],
    9: [[0.3, 0.16], [0.5, 0.16], [0.7, 0.16], [0.3, 0.5], [0.5, 0.5], [0.7, 0.5], [0.3, 0.84], [0.5, 0.84], [0.7, 0.84]],
  };

  function makeGrainPattern(ctx) {
    const c = document.createElement("canvas");
    c.width = 48; c.height = 48;
    const g = c.getContext("2d");
    g.fillStyle = "rgba(0,0,0,0)"; g.fillRect(0, 0, 48, 48);
    for (let i = 0; i < 140; i++) {
      g.fillStyle = `rgba(120,95,60,${(Math.random() * 0.06).toFixed(3)})`;
      g.fillRect(Math.random() * 48, Math.random() * 48, 1, 1);
    }
    return ctx.createPattern(c, "repeat");
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  class Renderer {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext("2d");
      this.style = "flat"; // 'flat' | 'classic'
      this.zoom = 1;
      this.minZoom = 0.4;
      this.maxZoom = 2.6;
      this.panX = 0;
      this.panY = 0;
      this.dpr = Math.min(window.devicePixelRatio || 1, 3);
      this._grain = null;
    }

    grain() {
      if (!this._grain) this._grain = makeGrainPattern(this.ctx);
      return this._grain;
    }

    resize(cssW, cssH) {
      this.cssW = cssW; this.cssH = cssH;
      this.canvas.width = Math.round(cssW * this.dpr);
      this.canvas.height = Math.round(cssH * this.dpr);
      this.canvas.style.width = cssW + "px";
      this.canvas.style.height = cssH + "px";
    }

    worldPos(tile) {
      return {
        x: tile.col * TILE_W + tile.level * LEVEL_DX,
        y: tile.row * TILE_H + tile.level * LEVEL_DY,

    boardBounds(tiles) {

    fitToScreen(tiles, padding = 24) {

      const zx = (this.cssW - padding * 2) / b.w;
      const zy = (this.cssH - padding * 2) / b.h;

      // makes tiles illegibly tiny. Prefer a legible minimum tile size and
      // let the player pan/pinch to see the rest, like real mobile Mahjong
      // Solitaire apps do — only fall back to "fit everything" on wider
      // screens (tablet/desktop) where that size is already comfortable.
      const isPhone = this.cssW < 700;
      const COMFORTABLE_TILE_W = 50; // CSS px
      const comfortableZoom = COMFORTABLE_TILE_W / TILE_W;
      const z = isPhone ? Math.max(fitAllZoom, comfortableZoom) : fitAllZoom;

      this.minZoom = Math.min(fitAllZoom, z) * 0.85;
      this.maxZoom = Math.max(2.6, z * 3.2);
      this.zoom = z;

      // zoom controls, not the full canvas — otherwise on phones the board
      // centers under the header and its top rows are permanently hidden.
      const topInset = isPhone ? this.topInset || 100 : 0;
      const bottomInset = isPhone ? this.bottomInset || 110 : 0;
      const visibleH = Math.max(100, this.cssH - topInset - bottomInset);
      const boardHZoomed = b.h * z;
      this.panX = (this.cssW - b.w * z) / 2 - b.minX * z;
      this.panY = boardHZoomed > visibleH
        ? topInset - b.minY * z // top-align: whole board still reachable by panning down
        : topInset + (visibleH - boardHZoomed) / 2 - b.minY * z;
    }

    clampPan(tiles) {
      const b = this.boardBounds(tiles);
      const margin = 120;
      const minPanX = this.cssW - (b.maxX * this.zoom) - margin;
      const maxPanX = -b.minX * this.zoom + margin;
      const minPanY = this.cssH - (b.maxY * this.zoom) - margin;
      const maxPanY = -b.minY * this.zoom + margin;
      this.panX = Math.min(Math.max(this.panX, Math.min(minPanX, maxPanX)), Math.max(minPanX, maxPanX));
      this.panY = Math.min(Math.max(this.panY, Math.min(minPanY, maxPanY)), Math.max(minPanY, maxPanY));
    }

    screenToWorld(sx, sy) {
      return { x: (sx - this.panX) / this.zoom, y: (sy - this.panY) / this.zoom };

    tileScreenRect(tile) {
      const p = this.worldPos(tile);

        y: p.y * this.zoom + this.panY,
        w: TILE_W * this.zoom,

    hitTest(tiles, sx, sy) {

        .filter((t) => !t.removed)
        .slice()
        .sort((a, b) => (b.level - a.level) || (b.row - a.row));

      const ctx = this.ctx;

      roundRect(ctx, x, y, w, h, rad);

      const ivoryBot = state.free ? "#efe6cd" : "#bdb6a3";

      grad.addColorStop(0, ivoryTop);
      grad.addColorStop(1, ivoryBot);

      ctx.beginPath(); ctx.moveTo(x + 2, y + h - 2); ctx.lineTo(x + 2, y + 2); ctx.lineTo(x + w - 2, y + 2);

      ctx.lineWidth = Math.max(1, w * 0.025);
      ctx.strokeStyle = state.selected ? "#ffb400" : (state.hinted ? "#2ab7ff" : "rgba(60,45,20,0.5)");

      ctx.stroke();

      if (!state.free) {
        ctx.save();
        roundRect(ctx, x, y, w, h, rad);

        ctx.fill();

        }

      if (tile.category === "wind" || tile.category === "dragon") {
        ctx.fillStyle = style === "classic"
          ? (tile.type === "dR" ? "#b5311f" : tile.type === "dG" ? "#1d7a45" : "#2b2b2b")

        ctx.font = `700 ${h * 0.44}px 'Noto Sans SC', 'PingFang SC', sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        if (tile.category === "dragon" && tile.type === "dW") {
          ctx.strokeStyle = ctx.fillStyle;
          ctx.lineWidth = Math.max(2, w * 0.05);
          roundRect(ctx, x + w * 0.24, y + h * 0.24, w * 0.52, h * 0.52, w * 0.06);
          ctx.stroke();
        } else {
          ctx.fillText(tile.glyph, cx, cy);

      if (tile.category === "flower" || tile.category === "season") {
        ctx.fillStyle = tile.color;
        ctx.font = `700 ${h * 0.4}px 'Noto Sans SC', 'PingFang SC', sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(tile.glyph, cx, cy - h * 0.02);
        ctx.font = `700 ${h * 0.14}px sans-serif`;
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillText(tile.category === "flower" ? "F" : "S", x + w * 0.16, y + h * 0.18);
      }
    }

    drawPips(tile, x, y, w, h, style) {
      const ctx = this.ctx;
      const pattern = PIP_PATTERNS[tile.rank] || PIP_PATTERNS[1];
      const pipColor = style === "classic"
        ? (tile.suit === "dot" ? "#1c3e8c" : "#1d7a45")
        : tile.color;
      const size = Math.min(w, h) * (tile.rank >= 7 ? 0.11 : 0.15);

      pattern.forEach(([px, py]) => {
        const cx = x + w * (0.15 + px * 0.7);
        const cy = y + h * (0.15 + py * 0.7);
        if (tile.suit === "dot") {
          ctx.beginPath();
          ctx.arc(cx, cy, size, 0, Math.PI * 2);
          ctx.fillStyle = pipColor;
          ctx.fill();
          ctx.beginPath();
          ctx.arc(cx, cy, size * 0.4, 0, Math.PI * 2);
          ctx.fillStyle = style === "classic" ? "#fffdf4" : "#ffffff";
          ctx.fill();
        } else {
          // bamboo: vertical stick with node lines
          ctx.fillStyle = pipColor;
          const bw = size * 0.7, bh = size * 2.1;
          roundRect(ctx, cx - bw / 2, cy - bh / 2, bw, bh, bw * 0.3);
          ctx.fill();
          ctx.strokeStyle = style === "classic" ? "#0d4a26" : "#0e6b3a";
          ctx.lineWidth = Math.max(1, size * 0.15);
          for (let n = -1; n <= 1; n++) {

            ctx.beginPath(); ctx.moveTo(cx - bw / 2, ny); ctx.lineTo(cx + bw / 2, ny); ctx.stroke();

  window.MJ.TILE_W = TILE_W;
  window.MJ.TILE_H = TILE_H;

// Core game state/logic + input handling (tap-to-select, drag-to-pan,
// pinch-to-zoom). UI chrome (menus, leaderboard forms) lives in main.js.
window.MJ = window.MJ || {};

(function () {
  const { Dealer, Layouts, TilesData, Renderer, Leaderboard, Audio } = window.MJ;

  // Difficulty changes how much assistance you get — every board is
  // solvable regardless of difficulty (that guarantee comes from the
  // dealer, not from these limits).
  const DIFFICULTY_PRESETS = {
    easy: { maxHints: 10, maxUndos: Infinity, maxReshuffles: Infinity, dimming: true },
    medium: { maxHints: 5, maxUndos: Infinity, maxReshuffles: Infinity, dimming: true },
    hard: { maxHints: 1, maxUndos: 3, maxReshuffles: 1, dimming: false },
  };

  class Game {
    constructor(canvas, callbacks) {
      this.canvas = canvas;
      this.renderer = new Renderer(canvas);
      this.cb = callbacks || {};
      this.tiles = [];
      this.selected = null;
      this.hintIds = null;
      this.hintTimeout = null;
      this.history = [];
      this.hintsUsed = 0;
      this.undosUsed = 0;
      this.reshufflesUsed = 0;
      this.difficulty = "medium";
      Object.assign(this, DIFFICULTY_PRESETS.medium);
      this.movesCount = 0;
      this.startTime = null;
      this.elapsedBeforePause = 0;
      this.paused = false;
      this.layoutKey = "turtle";
      this.finished = false;

      this._bindInput();
    }

    // ---------- lifecycle ----------

    newGame(layoutKey, seed, difficulty) {
      this.layoutKey = layoutKey;
      this.difficulty = difficulty || this.difficulty || "medium";
      Object.assign(this, DIFFICULTY_PRESETS[this.difficulty] || DIFFICULTY_PRESETS.medium);
      const cssW = this.canvas.clientWidth || window.innerWidth;
      const cssH = this.canvas.clientHeight || window.innerHeight;
      const isPhonePortrait = cssW < 700 && cssH > cssW;
      const positions = isPhonePortrait ? Layouts[layoutKey].positionsTall : Layouts[layoutKey].positions;
      const dealt = Dealer.dealSolvable(positions, seed ?? (Math.random() * 1e9 | 0));
      this.tiles = positions.map((p, i) => Object.assign({ id: i, col: p.col, row: p.row, level: p.level, removed: false }, dealt[i]));
      this.selected = null;
      this.hintIds = null;
      this.history = [];
      this.hintsUsed = 0;
      this.undosUsed = 0;
      this.reshufflesUsed = 0;
      this.movesCount = 0;
      this.startTime = performance.now();
      this.elapsedBeforePause = 0;
      this.paused = false;
      this.finished = false;
      this.renderer.fitToScreen(this.tiles);
      this._recomputeFree();
      this._draw();
    }

    resizeToContainer(cssW, cssH) {
      this.renderer.resize(cssW, cssH);
      if (this.tiles.length) this.renderer.fitToScreen(this.tiles);
      this._draw();
    }

    elapsedMs() {
      if (!this.startTime) return 0;
      if (this.paused) return this.elapsedBeforePause;
      return this.elapsedBeforePause + (performance.now() - this.startTime);
    }

    pause() {
      if (this.paused || this.finished) return;
      this.elapsedBeforePause = this.elapsedMs();
      this.paused = true;
    }

    resume() {
      if (!this.paused) return;
      this.startTime = performance.now();
      this.paused = false;
    }

    _byCell() {

      this.tiles.forEach((t) => { if (!t.removed) map.set(`${t.col},${t.row},${t.level}`, t); });
      return map;
    }

    _recomputeFree() {
      const byCell = this._byCell();
      this.freeSet = new Set();
      this.tiles.forEach((t) => {
        if (t.removed) return;
        const above = byCell.get(`${t.col},${t.row},${t.level + 1}`);
        if (above) return;
        const left = byCell.get(`${t.col - 1},${t.row},${t.level}`);
        const right = byCell.get(`${t.col + 1},${t.row},${t.level}`);
        if (left && right) return;
        this.freeSet.add(t.id);
      });
    }

    remainingTiles() { return this.tiles.filter((t) => !t.removed); }
    pairsLeft() { return this.remainingTiles().length / 2; }

    findAnyValidMove() {
      const free = this.remainingTiles().filter((t) => this.freeSet.has(t.id));
      for (let i = 0; i < free.length; i++) {
        for (let j = i + 1; j < free.length; j++) {
          if (TilesData.matches(free[i], free[j])) return [free[i], free[j]];
        }
      }
      return null;
    }

    selectTile(tile) {
      if (this.finished || this.paused) return;
      if (!this.freeSet.has(tile.id)) { Audio.play("invalid"); return; }

      if (!this.selected) {
        this.selected = tile;
        Audio.play("select");
        this._draw();
        return;
      }
      if (this.selected.id === tile.id) {
        this.selected = null;
        Audio.play("deselect");
        this._draw();
        return;
      }
      if (TilesData.matches(this.selected, tile)) {
        this._commitMatch(this.selected, tile);
      } else {
        Audio.play("invalid");
        const prev = this.selected;
        this.selected = tile;
        this._flashInvalid(prev, tile);
      }
    }

    _flashInvalid(a, b) {
      this._draw();
    }

    _commitMatch(a, b) {
      a.removed = true; b.removed = true;
      this.history.push({ aId: a.id, bId: b.id });
      this.selected = null;
      this.hintIds = null;
      this.movesCount++;
      Audio.play("match");
      this._recomputeFree();
      this._draw();

      if (this.pairsLeft() === 0) {
        this._onWin();
        return;
      }
      if (!this.findAnyValidMove()) {
        this.cb.onStuck && this.cb.onStuck();
        Audio.play("stuck");
      }
      this.cb.onChange && this.cb.onChange();
    }

    undo() {
      if (this.finished || !this.history.length) return;
      if (this.undosUsed >= this.maxUndos) { Audio.play("invalid"); return; }
      const last = this.history.pop();
      const a = this.tiles[last.aId], b = this.tiles[last.bId];
      a.removed = false; b.removed = false;
      this.selected = null;
      this.undosUsed++;
      this.movesCount++;
      Audio.play("undo");
      this._recomputeFree();
      this._draw();
      this.cb.onChange && this.cb.onChange();
    }

    hint() {
      if (this.finished || this.hintsUsed >= this.maxHints) { Audio.play("invalid"); return false; }
      const move = this.findAnyValidMove();
      if (!move) { Audio.play("invalid"); return false; }
      this.hintsUsed++;
      this.hintIds = new Set([move[0].id, move[1].id]);
      Audio.play("hint");
      this._draw();
      clearTimeout(this.hintTimeout);
      this.hintTimeout = setTimeout(() => { this.hintIds = null; this._draw(); }, 1600);
      this.cb.onChange && this.cb.onChange();
      return true;
    }

    shuffle() {
      if (this.finished) return;
      if (this.reshufflesUsed >= this.maxReshuffles) { Audio.play("invalid"); return; }
      const remaining = this.remainingTiles();
      if (remaining.length < 2) return;
      const positions = remaining.map((t) => ({ col: t.col, row: t.row, level: t.level }));
      const newTiles = Dealer.reshuffleRemaining(positions, remaining, Math.random() * 1e9 | 0);
      if (!newTiles) { Audio.play("invalid"); return; }
      remaining.forEach((t, i) => {
        Object.assign(t, { type: newTiles[i].type, category: newTiles[i].category, glyph: newTiles[i].glyph, suit: newTiles[i].suit, rank: newTiles[i].rank, color: newTiles[i].color, label: newTiles[i].label });
      });
      this.selected = null;
      this.hintIds = null;
      this.reshufflesUsed++;
      Audio.play("shuffle");
      this._recomputeFree();
      this._draw();
      this.cb.onChange && this.cb.onChange();
    }

    _onWin() {
      this.finished = true;
      const timeMs = Math.round(this.elapsedMs());
      this.cb.onWin && this.cb.onWin({ timeMs, moves: this.movesCount, hints: this.hintsUsed, layoutKey: this.layoutKey });
      Audio.play("win");
    }

    // ---------- rendering ----------

    _draw() {
      this.renderer.render(this.tiles, {
        selectedId: this.selected && this.selected.id,
        hintIds: this.hintIds,
        freeSet: this.dimming ? this.freeSet : null,
      });
    }

    // ---------- input: tap / drag / pinch ----------

    _bindInput() {
      const el = this.canvas;
      const pointers = new Map();
      let dragging = false;
      let dragMoved = false;
      let lastMid = null;
      let lastDist = null;
      let downInfo = null;

      const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
      const mid = (p1, p2) => ({ x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 });

      const getPos = (e) => {
        const rect = el.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      };

      el.addEventListener("pointerdown", (e) => {
        Audio.unlock();
        el.setPointerCapture(e.pointerId);
        const pos = getPos(e);
        pointers.set(e.pointerId, pos);
        dragMoved = false;
        if (pointers.size === 1) {
          downInfo = { pos, time: performance.now() };
          dragging = true;
        } else if (pointers.size === 2) {
          const pts = Array.from(pointers.values());
          lastMid = mid(pts[0], pts[1]);
          lastDist = dist(pts[0], pts[1]);
        }
      });

      el.addEventListener("pointermove", (e) => {
        if (!pointers.has(e.pointerId)) return;
        const pos = getPos(e);
        pointers.set(e.pointerId, pos);

        if (pointers.size === 2) {
          const pts = Array.from(pointers.values());
          const newMid = mid(pts[0], pts[1]);
          const newDist = dist(pts[0], pts[1]);
          const r = this.renderer;
          if (lastDist) {
            const scale = newDist / lastDist;
            const before = r.screenToWorld(lastMid.x, lastMid.y);
            r.zoom = Math.min(r.maxZoom, Math.max(r.minZoom, r.zoom * scale));
            const after = r.screenToWorld(lastMid.x, lastMid.y);
            r.panX += (after.x - before.x) * r.zoom;
            r.panY += (after.y - before.y) * r.zoom;
          }
          r.panX += newMid.x - lastMid.x;
          r.panY += newMid.y - lastMid.y;
          lastMid = newMid;
          lastDist = newDist;
          r.clampPan(this.tiles);
          dragMoved = true;
          this._draw();
          return;
        }

        if (dragging && downInfo) {
          const dx = pos.x - downInfo.pos.x, dy = pos.y - downInfo.pos.y;
          if (Math.hypot(dx, dy) > 6) dragMoved = true;
          const prev = downInfo.lastPos || downInfo.pos;
          this.renderer.panX += pos.x - prev.x;
          this.renderer.panY += pos.y - prev.y;
          downInfo.lastPos = pos;
          if (dragMoved) {
            this.renderer.clampPan(this.tiles);
            this._draw();
          }
        }
      });

      const endPointer = (e) => {
        const pos = pointers.get(e.pointerId) || getPos(e);
        const wasSingle = pointers.size === 1;
        pointers.delete(e.pointerId);
        if (pointers.size < 2) { lastMid = null; lastDist = null; }

        if (wasSingle && dragging && !dragMoved && downInfo) {
          const elapsed = performance.now() - downInfo.time;
          if (elapsed < 500) {
            const tile = this._hitTestWorld(pos);
            if (tile) this.selectTile(tile);
          }
        }
        dragging = pointers.size > 0;
        downInfo = null;
      };
      el.addEventListener("pointerup", endPointer);
      el.addEventListener("pointercancel", endPointer);

      el.addEventListener("wheel", (e) => {
        e.preventDefault();
        const r = this.renderer;
        const rect = el.getBoundingClientRect();
        const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
        const before = r.screenToWorld(sx, sy);
        const scale = e.deltaY < 0 ? 1.08 : 0.92;
        r.zoom = Math.min(r.maxZoom, Math.max(r.minZoom, r.zoom * scale));
        const after = r.screenToWorld(sx, sy);
        r.panX += (after.x - before.x) * r.zoom;
        r.panY += (after.y - before.y) * r.zoom;
        r.clampPan(this.tiles);
        this._draw();
      }, { passive: false });
    }

    _hitTestWorld(screenPos) {
      return this.renderer.hitTest(this.tiles, screenPos.x, screenPos.y);
    }

    zoomBy(factor, aroundCenter = true) {
      const r = this.renderer;
      const cx = this.canvas.clientWidth / 2, cy = this.canvas.clientHeight / 2;
      const before = r.screenToWorld(cx, cy);
      r.zoom = Math.min(r.maxZoom, Math.max(r.minZoom, r.zoom * factor));
      const after = r.screenToWorld(cx, cy);
      r.panX += (after.x - before.x) * r.zoom;
      r.panY += (after.y - before.y) * r.zoom;
      r.clampPan(this.tiles);
      this._draw();
    }

    resetView() {
      this.renderer.fitToScreen(this.tiles);
      this._draw();
    }
  }

  window.MJ.Game = Game;
})();

</script>
  <script>
// UI wiring: menus, settings, leaderboard, win flow. Boots the Game.
(function () {
  const { Layouts, Leaderboard, Audio, Music } = window.MJ;

  const $ = (sel) => document.querySelector(sel);
  const el = {
    board: $("#board"),
    hud: $("#hud"),
    statTime: $("#statTime"),
    statPairs: $("#statPairs"),
    btnMenu: $("#btnMenu"),
    btnUndo: $("#btnUndo"),
    btnHint: $("#btnHint"),
    btnShuffle: $("#btnShuffle"),
    btnZoomIn: $("#btnZoomIn"),
    btnZoomOut: $("#btnZoomOut"),
    btnFit: $("#btnFit"),
    screenMenu: $("#screenMenu"),
    screenPause: $("#screenPause"),
    screenSettings: $("#screenSettings"),
    screenLeaderboard: $("#screenLeaderboard"),
    screenWin: $("#screenWin"),
    layoutGrid: $("#layoutGrid"),
    difficultySegmented: $("#difficultySegmented"),
    difficultyHint: $("#difficultyHint"),
    btnPlay: $("#btnPlay"),
    btnLeaderboard: $("#btnLeaderboard"),
    btnSettings: $("#btnSettings"),
    continueHint: $("#continueHint"),
    btnResume: $("#btnResume"),
    btnRestartLayout: $("#btnRestartLayout"),
    btnBackToMenu: $("#btnBackToMenu"),
    styleSegmented: $("#styleSegmented"),
    soundToggle: $("#soundToggle"),
    musicToggle: $("#musicToggle"),
    btnClearBoard: $("#btnClearBoard"),
    btnCloseSettings: $("#btnCloseSettings"),
    lbLayoutTabs: $("#lbLayoutTabs"),
    lbList: $("#lbList"),
    btnCloseLeaderboard: $("#btnCloseLeaderboard"),
    winSummary: $("#winSummary"),
    winScoreForm: $("#winScoreForm"),
    winName: $("#winName"),
    btnSaveScore: $("#btnSaveScore"),
    btnWinPlayAgain: $("#btnWinPlayAgain"),
    btnWinMenu: $("#btnWinMenu"),
    stuckBanner: $("#stuckBanner"),
    btnStuckShuffle: $("#btnStuckShuffle"),
    btnStuckUndo: $("#btnStuckUndo"),
  };

  const LAYOUT_GLYPH = { turtle: "🐢", pyramid: "🔺", fortress: "🏰" };
  const DIFFICULTY_HINTS = {
    easy: "10 hints · unlimited undo · unlimited reshuffles · blocked tiles dimmed",
    medium: "5 hints · unlimited undo · unlimited reshuffles · blocked tiles dimmed",
    hard: "1 hint · 3 undos · 1 reshuffle · no dimming — figure out what's blocked yourself",
  };

  const prefs = loadPrefs();
  let selectedLayout = prefs.lastLayout || "turtle";
  let selectedDifficulty = prefs.difficulty || "medium";
  let gameStarted = false;
  let pendingWin = null;

  function loadPrefs() {
    try { return JSON.parse(localStorage.getItem("mj_prefs_v1")) || {}; } catch (e) { return {}; }
  }
  function savePrefs() {
    try { localStorage.setItem("mj_prefs_v1", JSON.stringify(prefs)); } catch (e) {}
  }

  // ---------- game setup ----------
  const game = new window.MJ.Game(el.board, {
    onChange: updateHud,
    onStuck: showStuckBanner,
    onWin: handleWin,
  });
  window.__MJ_GAME__ = game; // debug/test hook

  game.renderer.style = prefs.style || "flat";
  Audio.setEnabled(prefs.sound !== false);
  Music.setEnabled(prefs.music !== false);

  function fitCanvas() {
    const rect = el.board.parentElement.getBoundingClientRect();
    const hudRect = el.hud.getBoundingClientRect();
    const zoomRect = $("#zoomControls").getBoundingClientRect();
    game.renderer.topInset = hudRect.bottom + 28;
    game.renderer.bottomInset = rect.height - zoomRect.top + 28;
    game.resizeToContainer(rect.width, rect.height);
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", () => setTimeout(fitCanvas, 200));
  fitCanvas();

  function fmtTime(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  }

  let hudInterval = null;
  function updateHud() {
    el.statPairs.textContent = game.pairsLeft();
    el.btnUndo.style.opacity = (game.history.length && game.undosUsed < game.maxUndos) ? 1 : 0.4;
    el.btnHint.style.opacity = game.hintsUsed < game.maxHints ? 1 : 0.4;
    el.btnShuffle.style.opacity = game.reshufflesUsed < game.maxReshuffles ? 1 : 0.4;
  }
  function tickTimer() {
    if (!game.paused && gameStarted) el.statTime.textContent = fmtTime(game.elapsedMs());
  }

  function showStuckBanner() { el.stuckBanner.hidden = false; }
  function hideStuckBanner() { el.stuckBanner.hidden = true; }

  // ---------- screens ----------
  function hideAllScreens() {
    [el.screenMenu, el.screenPause, el.screenSettings, el.screenLeaderboard, el.screenWin].forEach((s) => (s.hidden = true));
  }
  function showScreen(s) { hideAllScreens(); s.hidden = false; }
  function showHud(visible) { el.hud.style.display = visible ? "flex" : "none"; document.getElementById("zoomControls").style.display = visible ? "flex" : "none"; }

  function buildLayoutGrid() {
    el.layoutGrid.innerHTML = "";
    Object.keys(Layouts).forEach((key) => {
      const card = document.createElement("button");
      card.className = "layoutCard" + (key === selectedLayout ? " active" : "");
      card.innerHTML = `<span class="glyph">${LAYOUT_GLYPH[key] || "🀄"}</span>${Layouts[key].name}`;
      card.addEventListener("click", () => {
        selectedLayout = key;
        prefs.lastLayout = key; savePrefs();
        buildLayoutGrid();
      });
      el.layoutGrid.appendChild(card);
    });
  }
  buildLayoutGrid();

  function buildDifficultySegmented() {
    Array.from(el.difficultySegmented.querySelectorAll(".segBtn")).forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.difficulty === selectedDifficulty);
      btn.onclick = () => {
        selectedDifficulty = btn.dataset.difficulty;
        prefs.difficulty = selectedDifficulty; savePrefs();
        buildDifficultySegmented();
      };
    });
    el.difficultyHint.textContent = DIFFICULTY_HINTS[selectedDifficulty] || "";
  }
  buildDifficultySegmented();

  function openMenu() {
    game.pause();
    showHud(false);
    el.continueHint.hidden = !gameStarted;
    showScreen(el.screenMenu);
  }

  function startNewGame() {
    hideStuckBanner();
    showHud(true);
    hideAllScreens();
    fitCanvas(); // measure HUD/zoom-control insets now that they're visible
    game.newGame(selectedLayout, undefined, selectedDifficulty);
    gameStarted = true;
    updateHud();
    el.statTime.textContent = "00:00";
  }

  el.btnPlay.addEventListener("click", () => {
    Audio.unlock();
    if (gameStarted && game.paused && game.layoutKey === selectedLayout && game.difficulty === selectedDifficulty && !game.finished) {
      showHud(true);
      hideAllScreens();
      fitCanvas();
      game.resume();
    } else {
      startNewGame();
    }
  });

  el.btnMenu.addEventListener("click", openMenu);
  el.btnResume.addEventListener("click", () => { showHud(true); hideAllScreens(); game.resume(); });
  el.btnRestartLayout.addEventListener("click", () => startNewGame());
  el.btnBackToMenu.addEventListener("click", () => { gameStarted = false; openMenu(); });

  el.btnUndo.addEventListener("click", () => game.undo());
  el.btnHint.addEventListener("click", () => game.hint());
  el.btnShuffle.addEventListener("click", () => { game.shuffle(); hideStuckBanner(); });
  el.btnStuckShuffle.addEventListener("click", () => { game.shuffle(); hideStuckBanner(); });
  el.btnStuckUndo.addEventListener("click", () => { game.undo(); hideStuckBanner(); });

  el.btnZoomIn.addEventListener("click", () => game.zoomBy(1.2));
  el.btnZoomOut.addEventListener("click", () => game.zoomBy(0.83));
  el.btnFit.addEventListener("click", () => game.resetView());

  // ---------- settings ----------
  el.btnSettings.addEventListener("click", () => showScreen(el.screenSettings));
  el.btnCloseSettings.addEventListener("click", () => showScreen(el.screenMenu));
  el.soundToggle.checked = prefs.sound !== false;
  el.soundToggle.addEventListener("change", () => {
    prefs.sound = el.soundToggle.checked;
    Audio.setEnabled(prefs.sound);
    savePrefs();
  });
  el.musicToggle.checked = prefs.music !== false;
  el.musicToggle.addEventListener("change", () => {
    prefs.music = el.musicToggle.checked;
    Music.setEnabled(prefs.music);
    savePrefs();
  });
  Array.from(el.styleSegmented.querySelectorAll(".segBtn")).forEach((btn) => {
    if (btn.dataset.style === (prefs.style || "flat")) btn.classList.add("active"); else btn.classList.remove("active");
    btn.addEventListener("click", () => {
      Array.from(el.styleSegmented.querySelectorAll(".segBtn")).forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      game.renderer.style = btn.dataset.style;
      prefs.style = btn.dataset.style;
      savePrefs();
      game._draw();
    });
  });
  el.btnClearBoard.addEventListener("click", () => {
    if (confirm("Clear all local leaderboard scores? This cannot be undone.")) {
      Leaderboard.clearAll();
      renderLeaderboard();
    }
  });

  // ---------- leaderboard ----------
  let lbActiveLayout = "turtle";
  function buildLbTabs() {
    el.lbLayoutTabs.innerHTML = "";
    Object.keys(Layouts).forEach((key) => {
      const btn = document.createElement("button");
      btn.className = "segBtn" + (key === lbActiveLayout ? " active" : "");
      btn.textContent = Layouts[key].name;
      btn.addEventListener("click", () => { lbActiveLayout = key; buildLbTabs(); renderLeaderboard(); });
      el.lbLayoutTabs.appendChild(btn);
    });
  }
  function renderLeaderboard() {
    const entries = Leaderboard.getEntries(lbActiveLayout);
    el.lbList.innerHTML = "";
    if (!entries.length) {
      el.lbList.innerHTML = `<li class="lbEmpty">No scores yet — be the first!</li>`;
      return;
    }
    entries.forEach((e, i) => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="lbRank">${i + 1}</span><span class="lbName">${escapeHtml(e.name)}</span><span class="lbTime">${fmtTime(e.timeMs)}</span>`;
      el.lbList.appendChild(li);
    });
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  el.btnLeaderboard.addEventListener("click", () => { buildLbTabs(); renderLeaderboard(); showScreen(el.screenLeaderboard); });
  el.btnCloseLeaderboard.addEventListener("click", () => showScreen(el.screenMenu));

  // ---------- win flow ----------
  function handleWin(result) {
    showHud(false);
    hideStuckBanner();
    const mins = Math.floor(result.timeMs / 60000);
    const secs = Math.floor((result.timeMs % 60000) / 1000);
    el.winSummary.textContent = `${Layouts[result.layoutKey].name} · ${fmtTime(result.timeMs)} · ${result.moves} moves · ${result.hints} hints used`;
    const qualifies = Leaderboard.qualifies(result.layoutKey, result.timeMs);
    el.winScoreForm.hidden = !qualifies;
    pendingWin = result;
    if (qualifies) el.winName.value = prefs.lastName || "";
    showScreen(el.screenWin);
  }
  el.btnSaveScore.addEventListener("click", () => {
    const name = (el.winName.value || "Player").trim().slice(0, 16) || "Player";
    prefs.lastName = name; savePrefs();
    Leaderboard.addEntry(pendingWin.layoutKey, { name, timeMs: pendingWin.timeMs, moves: pendingWin.moves, date: Date.now() });
    el.winScoreForm.hidden = true;
  });
  el.btnWinPlayAgain.addEventListener("click", () => startNewGame());
  el.btnWinMenu.addEventListener("click", () => { gameStarted = false; openMenu(); });

  // ---------- lifecycle ----------
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) game.pause();
  });

  hudInterval = setInterval(tickTimer, 250);
  showHud(false);
  showScreen(el.screenMenu);

})();

</script>
